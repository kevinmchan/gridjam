name: Deploy to Firebase Hosting

# Deploy the live site whenever main updates (e.g. when a PR is merged).
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          # Service-account JSON stored as a repo secret (see setup notes in the PR / README).
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GRIDJAM }}
          projectId: gridjam
          channelId: live
